[project]
name = "luci-assistant"
version = "0.1.0"
description = "Luci: asistente de voz en español para macOS que escucha siempre y responde cuando la llamas por su nombre"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["asistente de voz", "voice assistant", "whisper", "piper", "macos", "español"]
classifiers = [
    "Environment :: Console",
    "Natural Language :: Spanish",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "onnxruntime>=1.20",
    "openai>=3.49.0",
    "piper-tts>=1.8.0",
    "sounddevice>=0.5.6",
    "soxr>=1.1.0",
    "textual>=8.2.8",
    "tqdm>=4.66",
]

[project.urls]
Repositorio = "https://github.com/caracolaracol/luci-assistant"

[project.scripts]
luci = "luci.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["luci"]
